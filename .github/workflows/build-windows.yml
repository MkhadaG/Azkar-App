name: Build and release Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      # Pushing a version tag (for example v0.4.9) builds the installer, signs it,
      # and publishes a GitHub release with latest.json for the in-app updater.
      - name: Build, sign, and publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Azkar v__VERSION__"
          releaseBody: "Download the Windows installer below. Installed copies update themselves."
          releaseDraft: false
          prerelease: false

      # Also publish a copy with a fixed name, so one link always gives the newest installer:
      # https://github.com/OWNER/REPO/releases/latest/download/Azkar-Setup.exe
      - name: Publish the stable download name
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/bundle/nsis/*-setup.exe Azkar-Setup.exe
          gh release upload "$GITHUB_REF_NAME" Azkar-Setup.exe --clobber

      # Manual runs only build and keep the installer as a downloadable artifact.
      - name: Build the installer (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: npm run tauri build

      - name: Upload the installer (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: azkar-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
