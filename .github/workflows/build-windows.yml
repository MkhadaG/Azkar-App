name: Build and release Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      # Never publish a version tag if the app's embedded version does not match it.
      - name: Verify release versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          config_version="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("src-tauri/tauri.conf.json", "utf8")).version)')"
          package_version="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("package.json", "utf8")).version)')"
          cargo_version="$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f2)"

          echo "Release tag: $tag_version"
          echo "Tauri version: $config_version"
          echo "Package version: $package_version"
          echo "Cargo version: $cargo_version"

          if [[ "$tag_version" != "$config_version" || "$tag_version" != "$package_version" || "$tag_version" != "$cargo_version" ]]; then
            echo "::error::The pushed tag and all three app versions must match."
            exit 1
          fi

      # Upload the updater feed and signed bundle to the exact tag that triggered this run.
      - name: Build, sign, and publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Azkar ${{ github.ref_name }}"
          releaseBody: "Download the Windows installer below. Installed copies update themselves."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # Also publish a copy with a fixed name, so one link always gives the newest installer:
      # https://github.com/OWNER/REPO/releases/latest/download/Azkar-Setup.exe
      - name: Publish the stable download name
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/bundle/nsis/*-setup.exe Azkar-Setup.exe
          gh release upload "$GITHUB_REF_NAME" Azkar-Setup.exe --clobber

      # Manual runs only build and keep the installer as a downloadable artifact.
      - name: Build the installer (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: npm run tauri build

      - name: Upload the installer (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: azkar-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
